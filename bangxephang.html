<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng xếp hạng - Bubble Shooter</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#101746,#34206b);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:12px}
.card{width:min(100%,440px);align-self:flex-start;background:#171d4a;border:1px solid #6555bd;border-radius:24px;padding:16px;box-shadow:0 20px 70px #05051d99}
h1{text-align:center;margin:0 0 8px;font-size:24px;color:#ffe477}
h2{margin:18px 0 8px;font-size:16px;color:#ffe477}
.onl{font-size:12px;color:#9be7b0;text-align:center;min-height:15px;margin-bottom:6px}
.sub{color:#c5c9f5;font-size:13px;text-align:center;margin:0 0 10px;min-height:16px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:#282f69;font-size:14px;border-left:4px solid transparent}
.row.top1{border-left-color:#ffd34d;background:#3a3a6b}.row.top2{border-left-color:#d3d9e8}.row.top3{border-left-color:#d98f52}
.row.me{outline:2px solid #ffcc4d}
.rk{width:34px;text-align:center;font-weight:bold}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:bold;color:#ffe477}
.dt{font-size:11px;color:#bfc7ff;width:68px;text-align:right}
.msg{text-align:center;color:#c5c9f5;padding:20px 8px;font-size:14px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns>*{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px 15px;font-weight:bold;font-size:14px;cursor:pointer}
a.btn{background:#ffcc4d;color:#29204b}
button{background:#3b4390;color:#fff}
</style>
</head>
<body>
<div class="card">
  <h1>🏆 BẢNG XẾP HẠNG</h1>
  <div class="onl" id="onl"></div>
  <p class="sub" id="myRank"></p>
  <div class="list" id="boardBody"></div>
  <h2>📜 Lịch sử ván của bạn (trên máy này)</h2>
  <div class="list" id="hist"></div>
  <div class="btns"><a class="btn" href="index.html">← VỀ GAME</a><button id="reload">🔄 TẢI LẠI</button></div>
</div>
<script>
/* ====== CẤU HÌNH SUPABASE: điền giống hệt 2 dòng trong index.html ====== */
const SUPABASE_URL="";       // ví dụ: https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY="";  // khóa anon / publishable (KHÔNG dùng service_role)
const online=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let name="";
try{name=sessionStorage.getItem("bbName")||localStorage.getItem("bbLastName")||""}catch(e){}
const fmtDate=d=>{try{return new Date(d).toLocaleDateString("vi-VN")}catch(e){return ""}};
const fmtTime=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

async function rpc(fn,args){
  if(!online)throw new Error("not_configured");
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
  const headers={"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY};
  if(!SUPABASE_ANON_KEY.startsWith("sb_"))headers.Authorization="Bearer "+SUPABASE_ANON_KEY;
  try{
    const res=await fetch(SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers,body:JSON.stringify(args),signal:ctl.signal});
    if(!res.ok){let m="";try{m=(await res.json()).message||""}catch(e){}throw new Error(m||"HTTP "+res.status)}
    return await res.json();
  }finally{clearTimeout(t)}
}

let tok=0;
async function load(){
  const body=$("boardBody"),my=++tok;
  $("myRank").textContent="";
  const msg=t=>body.replaceChildren(el("div","msg",t));
  if(!online)return msg("Chưa cấu hình bảng xếp hạng trực tuyến (điền SUPABASE_URL và SUPABASE_ANON_KEY).");
  msg("Đang tải bảng xếp hạng…");
  try{
    const [top,me]=await Promise.all([rpc("leaderboard_top",{p_limit:50}),name?rpc("player_rank",{p_name:name}):Promise.resolve([])]);
    if(my!==tok)return;
    if(!top.length)return msg("Chưa có thành tích nào. Hãy là người đầu tiên!");
    const mine=name.toLowerCase();
    const row=(rk,n,s,d)=>{
      const r=el("div","row"+(rk<=3?" top"+rk:"")+(String(n).toLowerCase()===mine?" me":""));
      r.append(el("span","rk",rk<=3?["🥇","🥈","🥉"][rk-1]:"#"+rk),el("span","nm",n),el("span","sc",String(s)),el("span","dt",fmtDate(d)));return r};
    body.replaceChildren(...top.map(x=>row(x.rank,x.player_name,x.score,x.achieved_at)));
    const m=me&&me[0];
    if(m){
      $("myRank").textContent="Hạng của bạn: #"+m.rank+" / "+m.total+" · "+m.score+" điểm";
      if(m.rank>top.length)body.append(el("div","msg","⋯"),row(m.rank,name,m.score,m.achieved_at));
    }else if(name)$("myRank").textContent="Bạn chưa có thành tích trên bảng xếp hạng";
  }catch(e){
    if(my!==tok)return;
    body.replaceChildren(el("div","msg","Không tải được bảng xếp hạng (lỗi kết nối). Bấm TẢI LẠI để thử lại."));
  }
}

function renderHist(){
  const box=$("hist");let h=[];
  try{h=JSON.parse(localStorage.getItem("bbHistory")||"[]")}catch(e){}
  h=(Array.isArray(h)?h:[]).filter(g=>g&&String(g.name).toLowerCase()===name.toLowerCase()).slice(-10).reverse();
  if(!h.length)return box.replaceChildren(el("div","msg","Bạn chưa chơi ván nào trên thiết bị này."));
  const best=Math.max(...h.map(g=>g.score|0));
  box.replaceChildren(...h.map(g=>{
    const r=el("div","row"+((g.score|0)===best?" me":""));
    r.append(el("span","sc",String(g.score)),el("span","nm",g.shots+" lượt · "+fmtTime(g.duration|0)+(online&&!g.synced?" · chưa lưu":"")),el("span","dt",fmtDate(g.endedAt)));
    return r;
  }));
}

const cid=(()=>{try{let c=localStorage.getItem("bbCid");if(!c){c=(crypto.randomUUID&&crypto.randomUUID())||String(Math.random());localStorage.setItem("bbCid",c)}return c}catch(e){return String(Math.random())}})();
async function pingOnline(beat){
  if(!online)return;
  try{
    if(beat)await rpc("heartbeat",{p_client:cid});
    const n=await rpc("online_count",{});
    $("onl").textContent="🟢 "+n+" người đang chơi";
  }catch(e){}
}
$("reload").addEventListener("click",()=>{load();renderHist();pingOnline(true)});
setInterval(()=>{if(!document.hidden){pingOnline(true);load()}},30000);
load();renderHist();pingOnline(true);
</script>
</body>
</html>
