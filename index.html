
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0866ff">
  <title>Kênh Chat Trực Tuyến</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --primary: #0866ff;
      --background: #f0f2f5;
      --text: #172033;
      --muted: #8993a4;
      --border: #e8edf4;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      background: linear-gradient(135deg, #e5efff, #f5f7fb);
    }

    .chat-container {
      width: 100%;
      max-width: 460px;
      height: min(760px, calc(100dvh - 40px));
      min-height: 400px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(30, 55, 90, .15);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px;
      color: white;
      background: linear-gradient(135deg, #0866ff, #3987ff);
    }

    .avatar {
      position: relative;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      font-size: 23px;
    }

    .online-dot {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 12px;
      height: 12px;
      border: 2px solid white;
      border-radius: 50%;
      background: #20d67a;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .header-info p {
      font-size: 12px;
      opacity: .9;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px 15px;
      background: #fbfcfe;
      scroll-behavior: smooth;
    }

    .date-divider {
      align-self: center;
      padding: 7px 12px;
      border-radius: 20px;
      background: #edf2f8;
      color: var(--muted);
      font-size: 11px;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: appear .18s ease-out;
    }

    .incoming {
      align-self: flex-start;
      align-items: flex-start;
    }

    .outgoing {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message {
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .incoming .message {
      color: #273449;
      background: #edf1f7;
      border-bottom-left-radius: 5px;
    }

    .outgoing .message {
      color: white;
      background: linear-gradient(135deg, #1680ff, #0866ff);
      border-bottom-right-radius: 5px;
    }

    .sender-name {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: bold;
      opacity: .85;
    }

    .message-meta {
      margin-top: 5px;
      padding: 0 4px;
      color: #98a2b3;
      font-size: 10px;
    }

    .system-message {
      align-self: center;
      color: #8993a4;
      font-size: 11px;
      text-align: center;
    }

    .chat-input-area {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: white;
    }

    .chat-input-area input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 16px;
      outline: none;
      border: 1px solid #e0e5ed;
      border-radius: 24px;
      background: #f6f8fb;
      color: var(--text);
      font-size: 14px;
    }

    .chat-input-area input:focus {
      border-color: var(--primary);
      background: white;
    }

    .send-button {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      color: white;
      background: var(--primary);
      cursor: pointer;
      font-size: 19px;
    }

    .send-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .chat-footer {
      padding: 0 10px 12px;
      color: #a1a9b7;
      background: white;
      text-align: center;
      font-size: 10px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
        background: white;
      }

      .chat-container {
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .chat-header {
        padding: 15px;
      }

      .chat-messages {
        padding: 16px 12px;
      }

      .chat-input-area {
        padding: 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="chat-container">
    <header class="chat-header">
      <div class="avatar" aria-hidden="true">
        💬
        <span class="online-dot"></span>
      </div>

      <div class="header-info">
        <h1>Kênh Chat Trực Tuyến</h1>
        <p id="connectionStatus">Đang kết nối...</p>
      </div>
    </header>

    <section
      class="chat-messages"
      id="chatMessages"
      aria-label="Lịch sử tin nhắn"
      aria-live="polite"
    >
      <div class="date-divider">Phòng chat chung</div>
    </section>

    <form class="chat-input-area" id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Nhập tin nhắn của bạn..."
        autocomplete="off"
        maxlength="2000"
        aria-label="Nội dung tin nhắn"
      >

      <button
        class="send-button"
        id="sendButton"
        type="submit"
        aria-label="Gửi tin nhắn"
        disabled
      >➤</button>
    </form>

    <footer class="chat-footer">
      Chat trực tuyến · Vui lòng không chia sẻ thông tin nhạy cảm
    </footer>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const connectionStatus = document.getElementById("connectionStatus");

    let myName = localStorage.getItem("chat_display_name");

    if (!myName) {
      myName = prompt("Nhập tên hiển thị của bạn:") || "Khách";
      myName = myName.trim().slice(0, 30) || "Khách";
      localStorage.setItem("chat_display_name", myName);
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function renderMessage(message) {
      const row = document.createElement("div");
      const mine = message.id === socket.id;

      row.className = "message-row " +
        (mine ? "outgoing" : "incoming");

      const bubble = document.createElement("div");
      bubble.className = "message";

      const sender = document.createElement("span");
      sender.className = "sender-name";
      sender.textContent = mine ? "Bạn" : message.name;

      const content = document.createElement("div");
      content.textContent = message.text;

      bubble.append(sender, content);

      const meta = document.createElement("div");
      meta.className = "message-meta";
      meta.textContent = message.time;

      row.append(bubble, meta);

      chatMessages.appendChild(row);
      scrollToBottom();
    }

    socket.on("connect", () => {
      connectionStatus.textContent = "Trực tuyến · " + myName;
      sendButton.disabled = !messageInput.value.trim();
    });

    socket.on("disconnect", () => {
      connectionStatus.textContent = "Đang kết nối lại...";
      sendButton.disabled = true;
    });

    socket.on("connect_error", () => {
      connectionStatus.textContent = "Không thể kết nối máy chủ";
    });

    socket.on("chat-history", (history) => {
      const divider = chatMessages.querySelector(".date-divider");

      while (divider.nextSibling) {
        divider.nextSibling.remove();
      }

      history.forEach(renderMessage);
    });

    socket.on("new-message", (message) => {
      renderMessage(message);
    });

    messageInput.addEventListener("input", () => {
      sendButton.disabled =
        !messageInput.value.trim() || !socket.connected;
    });

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = messageInput.value.trim();

      if (!text || !socket.connected) return;

      socket.emit("send-message", {
        name: myName,
        text: text
      });

      messageInput.value = "";
      sendButton.disabled = true;
      messageInput.focus();
    });
  </script>
</body>
</html>
