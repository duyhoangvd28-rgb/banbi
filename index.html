<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0866ff">
  <title>Kênh Chat Trực Tuyến</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --primary: #0866ff;
      --primary-dark: #0052cc;
      --background: #f0f2f5;
      --text: #172033;
      --muted: #7d8798;
      --border: #e8edf4;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top left, #dceaff, transparent 45%),
        linear-gradient(135deg, #f5f7fb, #eaf0f8);
      color: var(--text);
    }

    .chat-container {
      width: 100%;
      max-width: 460px;
      height: min(720px, calc(100dvh - 40px));
      min-height: 400px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(30, 55, 90, .15);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px;
      color: white;
      background: linear-gradient(135deg, #0866ff, #3987ff);
    }

    .avatar {
      position: relative;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      font-size: 23px;
    }

    .online-dot {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #20d67a;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      font-size: 17px;
      margin-bottom: 5px;
    }

    .header-info p {
      font-size: 12px;
      opacity: .9;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #72ffb2;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #fbfcfe;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #dce3ed;
      border-radius: 10px;
    }

    .date-divider {
      align-self: center;
      padding: 6px 12px;
      border-radius: 20px;
      background: #edf2f8;
      color: var(--muted);
      font-size: 11px;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: appear .2s ease-out;
    }

    .message-row.incoming {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-row.outgoing {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message {
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .incoming .message {
      background: #edf1f7;
      color: #273449;
      border-bottom-left-radius: 5px;
    }

    .outgoing .message {
      color: white;
      background: linear-gradient(135deg, #1680ff, #0866ff);
      border-bottom-right-radius: 5px;
      box-shadow: 0 3px 8px rgba(8,102,255,.12);
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      padding: 0 4px;
      color: #98a2b3;
      font-size: 10px;
    }

    .message-status {
      color: var(--primary);
      font-size: 11px;
    }

    .typing {
      display: none;
      align-self: flex-start;
      padding: 12px 15px;
      background: #edf1f7;
      border-radius: 16px;
      gap: 4px;
    }

    .typing.active {
      display: flex;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #8d9aaf;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    .chat-input-area {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .chat-input-area input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 16px;
      outline: none;
      border: 1px solid #e0e5ed;
      border-radius: 24px;
      background: #f6f8fb;
      color: var(--text);
      font-size: 14px;
      transition: border-color .2s, background .2s;
    }

    .chat-input-area input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .chat-input-area input::placeholder {
      color: #9ba5b5;
    }

    .send-button {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      font-size: 19px;
      transition: transform .2s, background .2s, opacity .2s;
    }

    .send-button:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    .send-button:active {
      transform: scale(.94);
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: .45;
      transform: none;
    }

    .chat-footer {
      padding: 0 12px 10px;
      text-align: center;
      background: #fff;
      color: #a1a9b7;
      font-size: 10px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
        background: #fff;
      }

      .chat-container {
        width: 100%;
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }

      .chat-header {
        padding: 15px;
      }

      .chat-messages {
        padding: 16px 12px;
      }

      .chat-input-area {
        padding: 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="chat-container">
    <header class="chat-header">
      <div class="avatar" aria-hidden="true">
        💬
        <span class="online-dot"></span>
      </div>

      <div class="header-info">
        <h1>Kênh Chat Trực Tuyến</h1>
        <p id="connection-status">Sẵn sàng trò chuyện cùng bạn</p>
      </div>

      <div class="header-status">
        <span class="status-dot"></span>
        Trực tuyến
      </div>
    </header>

    <section
      class="chat-messages"
      id="chatMessages"
      aria-label="Lịch sử tin nhắn"
      aria-live="polite"
      aria-relevant="additions"
    >
      <div class="date-divider">Bắt đầu trò chuyện</div>

      <div class="message-row incoming">
        <div class="message">
          Xin chào! 👋 Chào mừng bạn đến với kênh chat trực tuyến. Mình có thể giúp gì cho bạn?
        </div>
        <div class="message-meta">Hệ thống · Vừa xong</div>
      </div>

      <div class="typing" id="typingIndicator" aria-label="Đang nhập">
        <span></span><span></span><span></span>
      </div>
    </section>

    <form class="chat-input-area" id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Nhập tin nhắn của bạn..."
        autocomplete="off"
        maxlength="2000"
        aria-label="Nội dung tin nhắn"
      >
      <button
        class="send-button"
        id="sendButton"
        type="submit"
        aria-label="Gửi tin nhắn"
        title="Gửi tin nhắn"
        disabled
      >
        ➤
      </button>
    </form>

    <footer class="chat-footer">
      Tin nhắn của bạn được hiển thị trong phiên chat này.
    </footer>
  </main>

  <script>
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typingIndicator = document.getElementById("typingIndicator");

    const STORAGE_KEY = "online_chat_messages_v1";

    function getTime() {
      return new Intl.DateTimeFormat("vi-VN", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date());
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function createMessage(text, type, time, status = "") {
      const row = document.createElement("div");
      row.className = `message-row ${type}`;

      const bubble = document.createElement("div");
      bubble.className = "message";
      // Dùng textContent để tránh chèn HTML không an toàn.
      bubble.textContent = text;

      const meta = document.createElement("div");
      meta.className = "message-meta";

      const timeText = document.createElement("span");
      timeText.textContent = time || getTime();
      meta.appendChild(timeText);

      if (status && type === "outgoing") {
        const statusText = document.createElement("span");
        statusText.className = "message-status";
        statusText.textContent = "✓ " + status;
        meta.appendChild(statusText);
      }

      row.append(bubble, meta);
      chatMessages.insertBefore(row, typingIndicator);

      return row;
    }

    function saveMessage(text, type, time) {
      try {
        const history = JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "[]"
        );

        history.push({ text, type, time });

        // Giới hạn lịch sử để tránh lưu dữ liệu quá lớn.
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(history.slice(-100))
        );
      } catch (error) {
        console.warn("Không thể lưu lịch sử chat.", error);
      }
    }

    function loadHistory() {
      try {
        const history = JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "[]"
        );

        if (!Array.isArray(history)) return;

        history.slice(-100).forEach(item => {
          if (
            typeof item.text === "string" &&
            ["incoming", "outgoing"].includes(item.type)
          ) {
            createMessage(
              item.text,
              item.type,
              typeof item.time === "string" ? item.time : ""
            );
          }
        });
      } catch (error) {
        console.warn("Không thể đọc lịch sử chat.", error);
      }
    }

    messageInput.addEventListener("input", () => {
      sendButton.disabled = !messageInput.value.trim();
    });

    chatForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = messageInput.value.trim();
      if (!text) return;

      const time = getTime();

      createMessage(text, "outgoing", time, "Đã gửi");
      saveMessage(text, "outgoing", time);

      messageInput.value = "";
      sendButton.disabled = true;
      messageInput.focus();
      scrollToBottom();

      // Phản hồi minh họa ở phía trình duyệt.
      // Muốn chat với người thật hoặc AI, cần kết nối máy chủ.
      typingIndicator.classList.add("active");
      scrollToBottom();

      window.setTimeout(() => {
        typingIndicator.classList.remove("active");

        const reply =
          "Cảm ơn bạn đã gửi tin nhắn! 😊 Đây là phản hồi tự động minh họa. Để trò chuyện theo thời gian thực, hãy kết nối ứng dụng với máy chủ chat.";

        const replyTime = getTime();

        createMessage(reply, "incoming", replyTime);
        saveMessage(reply, "incoming", replyTime);
        scrollToBottom();
      }, 1000);
    });

    loadHistory();
    scrollToBottom();
  </script>
</body>
</html>
